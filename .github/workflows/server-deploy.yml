name: Reusable Server Deploy

on:
  workflow_call:
    inputs:
      command:
        description: Remote shell command to execute
        required: true
        type: string
      port:
        description: SSH port
        required: false
        type: number
        default: 22
    secrets:
      server-host:
        required: true
      server-user:
        required: true
      ssh-private-key:
        required: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Deploy over SSH
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ secrets.server-host }}
          username: ${{ secrets.server-user }}
          key: ${{ secrets.ssh-private-key }}
          port: ${{ inputs.port }}
          script: ${{ inputs.command }}
