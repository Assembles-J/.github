name: Reusable Docker Build

on:
  workflow_call:
    inputs:
      image:
        description: Full image name without tag
        required: true
        type: string
      tag:
        description: Image tag
        required: false
        type: string
        default: latest
      context:
        description: Docker build context
        required: false
        type: string
        default: .
      dockerfile:
        description: Dockerfile path
        required: false
        type: string
        default: Dockerfile
      push:
        description: Push image after build
        required: false
        type: boolean
        default: false
    secrets:
      registry-username:
        required: false
      registry-token:
        required: false

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Log in to registry
        if: ${{ inputs.push }}
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.registry-username }}
          password: ${{ secrets.registry-token }}

      - name: Build image
        uses: docker/build-push-action@v6
        with:
          context: ${{ inputs.context }}
          file: ${{ inputs.dockerfile }}
          push: ${{ inputs.push }}
          tags: ${{ inputs.image }}:${{ inputs.tag }}
