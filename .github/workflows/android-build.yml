name: Reusable Android Build

on:
  workflow_call:
    inputs:
      java-version:
        description: JDK version used by Gradle
        required: false
        type: string
        default: '21'
      gradle-task:
        description: Gradle task to run
        required: false
        type: string
        default: assembleDebug
      working-directory:
        description: Directory containing the Gradle project
        required: false
        type: string
        default: .

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: ${{ inputs.java-version }}
          cache: gradle

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Build
        working-directory: ${{ inputs.working-directory }}
        run: ./gradlew ${{ inputs.gradle-task }}
