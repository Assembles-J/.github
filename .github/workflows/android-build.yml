name: Reusable Android Build

on:
  workflow_call:
    inputs:
      java-version:
        description: JDK version used by Gradle
        required: false
        type: string
        default: '21'
      gradle-task:
        description: Gradle task to run
        required: false
        type: string
        default: assembleDebug
      working-directory:
        description: Directory containing the Gradle project
        required: false
        type: string
        default: .
      artifact-name:
        description: Optional artifact name. Leave empty to skip upload.
        required: false
        type: string
        default: ''
      artifact-path:
        description: Artifact path relative to repository root.
        required: false
        type: string
        default: ''
      setup-android:
        description: Install/configure Android SDK before running Gradle.
        required: false
        type: boolean
        default: true

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: ${{ inputs.java-version }}

      - name: Set up Android SDK
        if: inputs.setup-android
        uses: android-actions/setup-android@v3

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Grant Gradle wrapper permission
        working-directory: ${{ inputs.working-directory }}
        run: chmod +x gradlew

      - name: Build
        working-directory: ${{ inputs.working-directory }}
        run: ./gradlew --no-daemon ${{ inputs.gradle-task }}

      - name: Upload build artifact
        if: inputs.artifact-name != '' && inputs.artifact-path != ''
        uses: actions/upload-artifact@v4
        with:
          name: ${{ inputs.artifact-name }}
          path: ${{ inputs.artifact-path }}
          if-no-files-found: error
